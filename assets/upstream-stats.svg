<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" role="img" aria-label="Merged upstream: 28 pull requests across Babel, Canonical, Flutter and Apache ShardingSphere">
  <title>Merged upstream: 28 PRs across 4 projects</title>
  <defs>
    <linearGradient id="shine" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="bars"><rect x="240" y="0" width="420" height="320"/></clipPath>
  </defs>
  <style>
    :root { --bg:#ffffff; --border:#d0d7de; --fg:#1f2328; --muted:#59636e; --track:#eaeef2; --accent:#8250df; --accent2:#bf3989; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0d1117; --border:#30363d; --fg:#e6edf3; --muted:#9198a1; --track:#21262d; --accent:#ab7df8; --accent2:#f778ba; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card  { fill: var(--bg); stroke: var(--border); }
    .title { fill: var(--fg); font-size: 22px; font-weight: 700; }
    .sub   { fill: var(--muted); font-size: 13px; }
    .big   { fill: var(--accent); font-size: 44px; font-weight: 800; }
    .bigl  { fill: var(--muted); font-size: 12px; letter-spacing: .08em; }
    .name  { fill: var(--fg); font-size: 15px; font-weight: 600; }
    .tag   { fill: var(--muted); font-size: 12px; }
    .count { fill: var(--fg); font-size: 14px; font-weight: 600; }
    .track { fill: var(--track); }
    .bar   { fill: url(#grad); }
    .dot   { fill: var(--accent); }

    @keyframes fadeUp  { from { opacity:0; transform: translateY(8px);} to { opacity:1; transform:none;} }
    @keyframes slideIn { from { opacity:0; transform: translateX(-14px);} to { opacity:1; transform:none;} }
    @keyframes grow    { from { transform: scaleX(0);} to { transform: scaleX(1);} }
    @keyframes pulse   { 0%,100% { opacity:1; r:5px;} 50% { opacity:.35; r:7px;} }
    @keyframes sweep   { 0% { transform: translateX(-140px);} 60%,100% { transform: translateX(560px);} }

    .head  { animation: fadeUp .6s ease-out both; }
    .stat  { animation: fadeUp .6s ease-out .25s both; }
    .row   { animation: slideIn .5s ease-out both; }
    .fill  { transform-box: fill-box; transform-origin: left center; animation: grow 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .r1 { animation-delay: .4s; }  .r1 .fill { animation-delay: .6s; }
    .r2 { animation-delay: .6s; }  .r2 .fill { animation-delay: .8s; }
    .r3 { animation-delay: .8s; }  .r3 .fill { animation-delay: 1.0s; }
    .r4 { animation-delay: 1.0s; } .r4 .fill { animation-delay: 1.2s; }
    .live  { animation: pulse 2.4s ease-in-out infinite; }
    .shine { animation: sweep 4.5s ease-in-out 2.4s infinite; transform: translateX(-140px); }
  </style>
  <linearGradient id="grad" x1="0" x2="1">
    <stop offset="0" stop-color="#8250df"/>
    <stop offset="1" stop-color="#bf3989"/>
  </linearGradient>

  <rect class="card" x="0.5" y="0.5" width="819" height="319" rx="14"/>

  <g class="head">
    <circle class="dot live" cx="38" cy="45" r="5"/>
    <text class="title" x="54" y="53">Merged upstream</text>
    <text class="sub" x="32" y="78">Fixes I've landed in compilers, dev tools and infrastructure</text>
  </g>

  <g class="stat">
    <text class="big" x="788" y="62" text-anchor="end">28</text>
    <text class="bigl" x="788" y="82" text-anchor="end">MERGED PRs · 4 PROJECTS</text>
  </g>

  <!-- rows: bar track x=240..660 (420px), scaled to 15 (28px per PR) -->
  <g class="row r1">
    <text class="name" x="32" y="130">Babel</text>
    <text class="tag" x="32" y="148">Compiler transforms · TDZ</text>
    <rect class="track" x="240" y="128" width="420" height="12" rx="6"/>
    <rect class="bar fill" x="240" y="128" width="420" height="12" rx="6"/>
    <text class="count" x="788" y="139" text-anchor="end">14 merged</text>
  </g>
  <g class="row r2">
    <text class="name" x="32" y="182">Canonical</text>
    <text class="tag" x="32" y="200">LXD · Multipass · Desktop Provision</text>
    <rect class="track" x="240" y="180" width="420" height="12" rx="6"/>
    <rect class="bar fill" x="240" y="180" width="280" height="12" rx="6"/>
    <text class="count" x="788" y="191" text-anchor="end">10 merged</text>
  </g>
  <g class="row r3">
    <text class="name" x="32" y="234">Flutter</text>
    <text class="tag" x="32" y="252">Gradle plugin · Linux embedder</text>
    <rect class="track" x="240" y="232" width="420" height="12" rx="6"/>
    <rect class="bar fill" x="240" y="232" width="56" height="12" rx="6"/>
    <text class="count" x="788" y="243" text-anchor="end">2 merged</text>
  </g>
  <g class="row r4">
    <text class="name" x="32" y="286">Apache ShardingSphere</text>
    <text class="tag" x="32" y="304">SQL parser · Doris dialect</text>
    <rect class="track" x="240" y="284" width="420" height="12" rx="6"/>
    <rect class="bar fill" x="240" y="284" width="28" height="12" rx="6"/>
    <text class="count" x="788" y="295" text-anchor="end">1 merged</text>
  </g>

  <!-- light sweep across the bars -->
  <g clip-path="url(#bars)">
    <rect class="shine" x="240" y="110" width="120" height="200" fill="url(#shine)" opacity=".5"/>
  </g>
</svg>
